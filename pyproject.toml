[project]
name = "anima"
version = "0.1.0"
description = "A single-user, API-key agent harness that holds positions under pushback — and the instruments that prove it."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
anima = "anima.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
